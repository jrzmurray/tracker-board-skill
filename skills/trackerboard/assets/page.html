<title>Tracker Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading column; summary strip, waves of phase rows, dependency graph, log. */
:root{
  --bg:#eef1f4;--paper:#fbfcfd;--ink:#16202b;--muted:#5a6878;--rule:#cfd7e0;--soft:#e3e8ee;
  --accent:#2b59c3;--accent-tint:#dde6f8;
  --todo:#5a6878;--todo-bg:#e6eaef;--active:#9a5b00;--active-bg:#fbecd2;--review:#6a3fb5;--review-bg:#ece4f8;
  --waiting:#4c6070;--waiting-bg:#e2e9ee;--blocked:#b3261e;--blocked-bg:#f9e0dd;--done:#23744a;--done-bg:#dcf0e3;
  --ongoing:#1f6f86;--ongoing-bg:#dbeff4;--external:#7a5a2e;--external-bg:#f1e8da;--dropped:#8792a0;--dropped-bg:#eceff2;
  --pct-none:#b3261e;--pct-low:#c25e00;--pct-mid:#8f7400;--pct-full:#23744a;
  --display:"Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif;
  --body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c;--paper:#18202a;--ink:#e4eaf1;--muted:#97a5b5;--rule:#2f3b48;--soft:#232d38;
  --accent:#86a8ff;--accent-tint:#22304d;
  --todo:#a3b0be;--todo-bg:#27313c;--active:#f2b75c;--active-bg:#3b2c12;--review:#c3a5f5;--review-bg:#30244a;
  --waiting:#a9bccb;--waiting-bg:#24303a;--blocked:#ff8f84;--blocked-bg:#46201d;--done:#7fd6a2;--done-bg:#1b3a29;
  --ongoing:#7fcde3;--ongoing-bg:#173640;--external:#e0bf8e;--external-bg:#3a2e1d;--dropped:#7f8b98;--dropped-bg:#222a33;
  --pct-none:#ff8f84;--pct-low:#ffa45c;--pct-mid:#e9d45f;--pct-full:#7fd6a2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c;--paper:#18202a;--ink:#e4eaf1;--muted:#97a5b5;--rule:#2f3b48;--soft:#232d38;
  --accent:#86a8ff;--accent-tint:#22304d;
  --todo:#a3b0be;--todo-bg:#27313c;--active:#f2b75c;--active-bg:#3b2c12;--review:#c3a5f5;--review-bg:#30244a;
  --waiting:#a9bccb;--waiting-bg:#24303a;--blocked:#ff8f84;--blocked-bg:#46201d;--done:#7fd6a2;--done-bg:#1b3a29;
  --ongoing:#7fcde3;--ongoing-bg:#173640;--external:#e0bf8e;--external-bg:#3a2e1d;--dropped:#7f8b98;--dropped-bg:#222a33;
  --pct-none:#ff8f84;--pct-low:#ffa45c;--pct-mid:#e9d45f;--pct-full:#7fd6a2;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);margin:0;padding-block:28px 64px;padding-inline:max(16px,3vw)}
main{max-width:1180px;margin:0 auto;display:grid;gap:24px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
code{font-family:var(--mono);font-size:.86em;background:var(--soft);padding:1px 5px;border-radius:3px;overflow-wrap:anywhere}
header{display:grid;gap:6px}
.eyebrow{font:600 12px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(24px,3.4vw,32px)/1.15 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:700 17px/1.3 var(--display);margin:0;text-wrap:balance}
.lede{color:var(--muted);max-width:72ch;margin:0}
.stamp{font:12px var(--mono);color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;min-width:0}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft)}
.bar span{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:baseline;gap:6px;font:12px var(--mono);border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip b{font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;align-self:center}
.wavehead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
.wavehead .wid{font:600 12px var(--mono);color:var(--accent);background:var(--accent-tint);padding:1px 7px;border-radius:3px}
.wavehead .count{font:12px var(--mono);color:var(--muted);margin-left:auto}
.lanegroup+.lanegroup{margin-top:18px}
.lanehead{margin:0;padding:8px 2px}
.lanehead h2,.lanehead h3{font:600 16px var(--display);margin:0}
.lanerule{border:0;border-top:1px solid var(--muted);opacity:.55;margin:0}
.lanerule+.cols{margin-top:8px}
.count.pct-none{color:var(--pct-none)}.count.pct-low{color:var(--pct-low)}
.count.pct-mid{color:var(--pct-mid)}.count.pct-full{color:var(--pct-full)}
.count[class*="pct-"]{font-weight:600}
.wavenotes{color:var(--muted);font-size:14px;margin:-4px 0 10px;max-width:80ch}
.cols,.phase>summary{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(130px,1fr) minmax(90px,.7fr) minmax(110px,.8fr);gap:12px;align-items:start}
.cols{font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 10px 6px;border-bottom:1px solid var(--rule)}
.phase{border-bottom:1px solid var(--soft)}
.phase:last-child{border-bottom:0}
.phase>summary{list-style:none;cursor:pointer;padding:10px;border-radius:6px}
.phase>summary::-webkit-details-marker{display:none}
.phase>summary:hover{background:var(--soft)}
.phase.flash>summary{background:var(--accent-tint)}
.pid{font:600 13px var(--mono)}
.ptitle{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.lane{font:11px var(--mono);color:var(--muted);border:1px solid var(--rule);border-radius:3px;padding:0 5px;margin-left:6px;white-space:nowrap}
.pill{display:inline-block;font:600 11px/1.6 var(--mono);letter-spacing:.03em;padding:1px 8px;border-radius:3px;white-space:nowrap}
.snote{display:block;font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.deps{font:12px var(--mono);overflow-wrap:anywhere}
.deps a{text-decoration:none}
.deps .ok{color:var(--done)}
.prc{font:12px var(--mono);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcell{display:grid;grid-template-columns:14px minmax(0,1fr);gap:6px;align-items:start}
.chev{display:inline-block;width:14px;text-align:center;color:var(--ink);opacity:.7;font:16px/18px var(--mono);transition:transform .15s}
.phase>summary:hover .chev{color:var(--accent);opacity:1}
.cols>span:first-child{padding-left:20px}
.phase[open] .chev{transform:rotate(90deg)}
.body{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));padding:4px 10px 16px}
.field h3{font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.field{min-width:0;font-size:14px}
.field p{margin:0 0 6px;max-width:75ch}
.field ul{margin:0;padding-left:18px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:12px var(--mono);background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:5px;padding:4px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.gview{position:relative;margin-top:8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.gview.panning{cursor:grabbing}
.gview svg{display:block;width:100%;height:100%}
.gview svg text{font-family:var(--mono)}
.gnode:focus-visible rect{stroke:var(--accent);stroke-width:2.5}
.gctl{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.gctl .btn{padding:2px 8px;min-width:30px;background:var(--paper);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.ghint{font-size:12px;color:var(--muted);margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.log li{display:grid;grid-template-columns:150px 1fr;gap:12px;font-size:14px}
.log time{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.notes p{margin:0 0 8px;max-width:80ch}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:8px}
.status-todo{background:var(--todo-bg);color:var(--todo)}.status-active{background:var(--active-bg);color:var(--active)}
.status-review{background:var(--review-bg);color:var(--review)}.status-waiting{background:var(--waiting-bg);color:var(--waiting)}
.status-blocked{background:var(--blocked-bg);color:var(--blocked)}.status-done{background:var(--done-bg);color:var(--done)}
.status-ongoing{background:var(--ongoing-bg);color:var(--ongoing)}.status-external{background:var(--external-bg);color:var(--external)}
.status-dropped{background:var(--dropped-bg);color:var(--dropped)}
@media (max-width:720px){
  .cols{display:none}
  .phase>summary{grid-template-columns:1fr 1fr;grid-template-areas:"id id" "st st" "dp pr"}
  .phase>summary>:nth-child(1){grid-area:id}.phase>summary>:nth-child(2){grid-area:st}
  .phase>summary>:nth-child(3){grid-area:dp}.phase>summary>:nth-child(4){grid-area:pr}
  .log li{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
<main id="app">
  <header>
    <div class="eyebrow" id="eyebrow">Tracker board</div>
    <h1 id="title">Loading board</h1>
  </header>
  <section class="panel empty" id="empty">
    <h2>Waiting for board data</h2>
    <p>Phases appear here once the board is pushed with <code>trackerboard push</code>.</p>
  </section>
</main>
<script type="application/json" id="tb-data">null</script>
<script>
(() => {
  const STATUS = ["active","review","blocked","waiting","todo","ongoing","external","done","dropped"];
  const LABEL = {todo:"not started",active:"in progress",review:"in review",waiting:"waiting",blocked:"blocked",done:"done",ongoing:"ongoing",external:"external",dropped:"dropped"};
  const app = document.getElementById("app");
  let board = null, filter = null, openIds = new Set();
  try { filter = localStorage.getItem("tb-filter") || null; } catch {}

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const keyOf = (s) => String(s).toLowerCase();
  const domId = (s) => "p-" + String(s).replace(/[^A-Za-z0-9_-]/g, "_");

  function inline(text) {
    const repo = (board && board.repoUrl || "").replace(/\/+$/, "");
    const codes = [];
    let s = esc(text).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (_, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//, "").slice(0, 60)}</a>`);
    if (repo) s = s.replace(/(^|[\s(·,;])#(\d{1,7})\b/g, (_, p, n) => `${p}<a href="${repo}/pull/${n}" target="_blank" rel="noopener">#${n}</a>`);
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
  }
  function md(text) {
    if (!text) return "";
    return String(text).trim().split(/\n{2,}/).map((block) => {
      const lines = block.split("\n");
      if (lines.every((l) => /^\s*[-*] /.test(l))) return "<ul>" + lines.map((l) => `<li>${inline(l.replace(/^\s*[-*] /, ""))}</li>`).join("") + "</ul>";
      return `<p>${lines.map(inline).join("<br>")}</p>`;
    }).join("");
  }
  const pill = (st) => `<span class="pill status-${esc(st)}">${esc(LABEL[st] || st)}</span>`;
  const fmtTime = (iso) => { const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toISOString().slice(0, 16).replace("T", " ") + "Z"; };

  function phasesOf(b) { return b.waves.flatMap((w) => w.phases.map((p) => ({ wave: w, phase: p }))); }

  function summary(b) {
    const all = phasesOf(b), n = all.length || 1;
    const counts = Object.fromEntries(STATUS.map((s) => [s, 0]));
    all.forEach(({ phase }) => counts[phase.status] = (counts[phase.status] || 0) + 1);
    const bar = STATUS.filter((s) => counts[s]).map((s) => `<span style="width:${(counts[s] / n) * 100}%;background:var(--${s})" title="${LABEL[s]}: ${counts[s]}"></span>`).join("");
    const chips = STATUS.filter((s) => counts[s]).map((s) =>
      `<button class="chip" data-filter="${s}" aria-pressed="${filter === s}"><i style="background:var(--${s})"></i>${LABEL[s]} <b>${counts[s]}</b></button>`).join("");
    return `<section class="panel" aria-label="Status summary"><div class="bar" role="img" aria-label="${all.length} phases by status">${bar}</div><div class="chips">${chips}${filter ? `<button class="chip" data-filter="">show all</button>` : ""}</div></section>`;
  }

  function phaseRow(b, phase, statusOf) {
    const deps = phase.deps.length ? phase.deps.map((d) => {
      const done = ["done", "dropped"].includes(statusOf.get(keyOf(d)));
      return `<a href="#${domId(d)}" data-jump="${esc(d)}" class="${done ? "ok" : ""}">${esc(d)}${done ? " ✓" : ""}</a>`;
    }).join(", ") : `<span style="color:var(--muted)">none</span>`;
    const fields = [["Requirements", phase.req], ["PR", (phase.pr || "").length > 60 ? phase.pr : ""], ["Review", phase.review], ["Notes", phase.notes]].filter(([, v]) => v);
    const body = fields.length ? fields.map(([h, v]) => `<div class="field"><h3>${h}</h3>${md(v)}</div>`).join("") : `<div class="field" style="color:var(--muted)">No details recorded.</div>`;
    return `<details class="phase" id="${domId(phase.id)}" ${openIds.has(phase.id) ? "open" : ""}>
      <summary>
        <div class="pcell"><span class="chev" aria-hidden="true">▸</span><div><span class="pid">${esc(phase.id)}</span>${phase.owner ? `<span class="lane owner" title="Owner">@${esc(phase.owner)}</span>` : ""}<span class="ptitle">${inline(phase.title)}</span></div></div>
        <div>${pill(phase.status)}${phase.note ? `<span class="snote">${inline(phase.note)}</span>` : ""}</div>
        <div class="deps">${deps}</div>
        <div class="prc">${phase.pr ? inline(phase.pr) : `<span style="color:var(--muted)">—</span>`}</div>
      </summary>
      <div class="body">${body}</div>
    </details>`;
  }

  // One panel per wave; inside it, one table per lane (the phases' lane field,
  // in order of first use). On a board with one untitled wave the lane
  // headers are the panel's only headers.
  function waves(b) {
    const statusOf = new Map(phasesOf(b).map(({ phase }) => [keyOf(phase.id), phase.status]));
    const single = b.waves.length === 1 && !b.waves[0].title && !b.waves[0].notes;
    const cols = `<div class="cols"><span>Phase</span><span>Status</span><span>Depends on</span><span>PR</span></div>`;
    // done count coloured by completion: 0% red, 1-50% orange, 51-99% yellow, 100% green
    const tally = (ps) => {
      const done = ps.filter((p) => p.status === "done").length, pct = ps.length ? done / ps.length * 100 : null;
      const cls = pct == null ? "" : pct === 0 ? "pct-none" : pct <= 50 ? "pct-low" : pct < 100 ? "pct-mid" : "pct-full";
      return `<span class="count ${cls}" title="${pct == null ? "" : Math.round(pct) + "% done"}">${done}/${ps.length} done</span>`;
    };
    return b.waves.map((w) => {
      const lanes = new Map();
      for (const p of w.phases) {
        const k = String(p.lane || "").trim();
        if (!lanes.has(k)) lanes.set(k, []);
        lanes.get(k).push(p);
      }
      const groups = [...lanes].map(([lane, ps]) => ({ lane, ps, rows: ps.filter((p) => !filter || p.status === filter) }))
        .filter((g) => !filter || g.rows.length);
      if (filter && !groups.length) return "";
      const laneHead = (g, tag) => `<hr class="lanerule"><div class="wavehead lanehead"><${tag}>${g.lane ? `Lane ${esc(g.lane)}` : "No lane"}</${tag}>${tally(g.ps)}</div><hr class="lanerule">`;
      const tables = groups.map((g, i) => `<div class="lanegroup">
          ${laneHead(g, single ? "h2" : "h3")}
          ${cols}
          ${g.rows.map((p) => phaseRow(b, p, statusOf)).join("")}
        </div>`).join("");
      const head = single
        ? (groups.length ? "" : `<div class="wavehead"><h2>Phases</h2>${tally(w.phases)}</div>`)
        : `<div class="wavehead"><span class="wid">${esc(w.id)}</span><h2>${inline(w.title || "Wave " + w.id)}</h2>${tally(w.phases)}</div>`;
      return `<section class="panel" aria-label="Wave ${esc(w.id)}">
        ${head}
        ${w.notes ? `<div class="wavenotes">${md(w.notes)}</div>` : ""}
        ${tables || `<p style="color:var(--muted);margin:10px">No phases yet.</p>`}
      </section>`;
    }).join("");
  }

  // Layered left-to-right DAG: column = longest dependency chain, rows ordered
  // by a barycenter pass so edges cross less.
  // Geometry comes precomputed from the CLI (ELK layered layout, stored as
  // b.layout). If it is missing or stale, fall back to a simple layering here.
  function graphLayout(b, all) {
    const L = b.layout;
    if (L && Array.isArray(L.nodes)) {
      const have = new Set(L.nodes.map((n) => keyOf(n.id)));
      const edges = new Set((L.edges || []).map((e) => keyOf(e.from) + ">" + keyOf(e.to)));
      const fresh = all.every((p) => (!p.deps.length || have.has(keyOf(p.id))) && p.deps.every((d) => edges.has(keyOf(d) + ">" + keyOf(p.id))));
      if (fresh) return L;
    }
    const byKey = new Map(all.map((p) => [keyOf(p.id), p]));
    const layer = new Map();
    const depth = (p, seen = new Set()) => {
      if (layer.has(p.id)) return layer.get(p.id);
      if (seen.has(p.id)) return 0;
      seen.add(p.id);
      const l = p.deps.reduce((m, d) => byKey.has(keyOf(d)) ? Math.max(m, depth(byKey.get(keyOf(d)), seen) + 1) : m, 0);
      layer.set(p.id, l);
      return l;
    };
    all.forEach((p) => depth(p));
    const cols = [];
    all.forEach((p) => (cols[layer.get(p.id)] ||= []).push(p));
    const row = new Map();
    const bary = (p) => {
      const r = p.deps.map((d) => row.get(byKey.get(keyOf(d))?.id)).filter((x) => x != null);
      return r.length ? r.reduce((s, x) => s + x, 0) / r.length : 1e6;
    };
    cols.forEach((c, ci) => {
      if (ci > 0) c.sort((a, z) => bary(a) - bary(z));
      c.forEach((p, i) => row.set(p.id, i));
    });
    const W = 232, H = 44, GX = 44, GY = 14, PAD = 8;
    const maxRows = Math.max(...cols.map((c) => c.length));
    const pos = new Map();
    const nodes = all.map((p) => {
      const c = cols[layer.get(p.id)], off = (maxRows - c.length) * (H + GY) / 2;
      const n = { id: p.id, x: PAD + layer.get(p.id) * (W + GX), y: PAD + off + row.get(p.id) * (H + GY), w: W, h: H };
      pos.set(p.id, n);
      return n;
    });
    const edges = [];
    all.forEach((p) => p.deps.forEach((d) => {
      const q = byKey.get(keyOf(d)); if (!q) return;
      const s = pos.get(q.id), t = pos.get(p.id);
      const x1 = s.x + W, y1 = s.y + H / 2, x2 = t.x, y2 = t.y + H / 2, mx = x2 - GX / 2;
      edges.push({ from: q.id, to: p.id, points: [[x1, y1], [mx, y1], [mx, y2], [x2, y2]] });
    }));
    return { engine: "fallback", width: cols.length * (W + GX) - GX + PAD * 2, height: maxRows * (H + GY) - GY + PAD * 2, groups: [], nodes, edges };
  }

  // Orthogonal polyline with softened corners.
  function edgePath(pts, r = 5) {
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
      const r1 = Math.min(r, Math.hypot(x - px, y - py) / 2), r2 = Math.min(r, Math.hypot(nx - x, ny - y) / 2);
      const ax = x - Math.sign(x - px) * r1, ay = y - Math.sign(y - py) * r1;
      const bx = x + Math.sign(nx - x) * r2, by = y + Math.sign(ny - y) * r2;
      d += ` L${ax},${ay} Q${x},${y} ${bx},${by}`;
    }
    const [lx, ly] = pts[pts.length - 1];
    return d + ` L${lx},${ly}`;
  }

  const clip = (s, n) => s.length > n ? s.slice(0, Math.max(1, n - 1)) + "…" : s;

  // Node label: "ID - title" as one flow of 11px mono text over two lines, the
  // ID bold. Wraps at spaces; a word longer than a line is cut. Overflow on the
  // second line ends in an ellipsis.
  const CH = 6.6; // JetBrains Mono advance at 11px
  function labelLines(id, title, w) {
    const per = Math.max(8, Math.floor((w - 20) / CH));
    const words = (id + (title ? " - " + title : "")).split(/\s+/).filter(Boolean);
    const lines = [""];
    for (let word of words) {
      while (word) {
        const cur = lines[lines.length - 1];
        const room = per - cur.length - (cur ? 1 : 0);
        if (word.length <= room) { lines[lines.length - 1] = cur ? cur + " " + word : word; word = ""; }
        else if (!cur) { lines[lines.length - 1] = word.slice(0, per); word = word.slice(per); lines.push(""); }
        else lines.push("");
        if (lines.length > 2) break;
      }
      if (lines.length > 2) break;
    }
    const over = lines.length > 2;
    const out = lines.slice(0, 2).filter((l, i) => l || i === 0);
    if (over) out[1] = clip(out[1] + " …", per).replace(/ ?…$/, "…");
    return out;
  }
  function labelSvg(id, title, n) {
    const lines = labelLines(id, title, n.w);
    const pad = n.h / 2 - (lines.length === 1 ? -4 : 3.5);
    return lines.map((line, i) => {
      const y = n.y + pad + i * 15;
      let body = esc(line);
      if (i === 0) {
        const bold = line.slice(0, Math.min(line.length, id.length));
        body = `<tspan font-weight="700" fill="var(--ink)">${esc(bold)}</tspan>${esc(line.slice(bold.length))}`;
      } else if (lines[0].length < id.length) {
        const rest = id.slice(lines[0].length), bold = line.slice(0, Math.min(line.length, rest.length));
        body = `<tspan font-weight="700" fill="var(--ink)">${esc(bold)}</tspan>${esc(line.slice(bold.length))}`;
      }
      return `<text x="${n.x + 10}" y="${y}" font-size="11" fill="var(--ink)" fill-opacity=".86">${body}</text>`;
    }).join("");
  }

  function graph(b) {
    const all = phasesOf(b).map(({ phase }) => phase);
    if (!all.some((p) => p.deps.length)) { gl = null; return ""; }
    const byKey = new Map(all.map((p) => [keyOf(p.id), p]));
    const L = graphLayout(b, all);
    gl = L;
    const groups = (L.groups || []).map((g) => `<g class="gwave">
      <rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="8" fill="var(--soft)" fill-opacity=".45" stroke="var(--rule)"/>
      <text x="${g.x + 12}" y="${g.y + 19}" font-size="11" font-weight="600" fill="var(--muted)">${esc(clip(g.title ? `${g.wave} · ${g.title}` : g.wave, Math.floor((g.w - 24) / 6.6)))}</text></g>`).join("");
    const edges = (L.edges || []).map((e) => `<path d="${edgePath(e.points)}" fill="none" stroke="var(--rule)" stroke-width="1.5" marker-end="url(#tb-arrow)"/>`).join("");
    const nodes = L.nodes.map((n) => {
      const p = byKey.get(keyOf(n.id)); if (!p) return "";
      const title = String(p.title || "").replace(/[`*]/g, "");
      return `<g class="gnode" data-jump="${esc(p.id)}" style="cursor:pointer" tabindex="0" role="link" aria-label="${esc(p.id)} ${esc(title)} (${esc(LABEL[p.status])})">
        <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="6" fill="var(--${p.status}-bg)" stroke="var(--${p.status})" stroke-width="1.2"/>
        ${labelSvg(p.id, title, n)}
        <title>${esc(p.id)} - ${esc(title)} (${esc(LABEL[p.status])}${p.owner ? ", @" + esc(p.owner) : ""})</title></g>`;
    }).join("");
    const legend = STATUS.filter((s) => all.some((p) => p.status === s)).map((s) => `<span>${pill(s)}</span>`).join("");
    return `<section class="panel" aria-label="Dependency graph"><h2>Dependency graph</h2>
      <div class="gview" id="tb-gview"><svg role="img" aria-label="Phase dependency graph" data-engine="${esc(L.engine || "")}">
      <defs><marker id="tb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker></defs>
      <g class="gcam" transform="scale(${MIN_READ})">${groups}${edges}${nodes}</g></svg>
      <div class="gctl"><button class="btn" data-gz="out" aria-label="Zoom out">−</button><button class="btn" data-gz="in" aria-label="Zoom in">+</button><button class="btn" data-gz="fit" aria-label="Fit whole graph">Fit</button><button class="btn" data-gz="reset" aria-label="Reset view">Reset</button></div></div>
      <div class="ghint">Drag to pan · ${/Mac|iPhone|iPad/.test(navigator.platform) ? "⌘" : "Ctrl"}+scroll or pinch to zoom · click a phase to open it</div>
      <div class="legend">${legend}</div></section>`;
  }

  // Pan/zoom over the graph with a transform in screen pixels (no viewBox, so a
  // mis-measured box can never rescale the drawing). k is screen px per graph
  // unit. The box starts at the smallest scale that keeps 11px labels legible
  // (or fits the whole graph if that is larger), and grows tall enough to show
  // the graph at that scale, up to most of the window.
  const MIN_READ = 0.9, MAX_K = 2.5;
  let gl = null, gv = null; // gv: {k, x, y, touched, sig}
  function initGraph() {
    const box = document.getElementById("tb-gview");
    if (!box || !gl) return;
    const cam = box.querySelector(".gcam");
    const sig = `${gl.width}x${gl.height}`;
    const minK = () => Math.min(MIN_READ, box.clientWidth / gl.width, 1);
    const baseK = () => Math.min(1, Math.max(MIN_READ, box.clientWidth / gl.width));
    const size = () => {
      const maxH = Math.max(280, Math.round(window.innerHeight * 0.72));
      box.style.height = Math.min(maxH, Math.ceil(gl.height * baseK()) + 2) + "px";
    };
    const apply = () => {
      const w = box.clientWidth / gv.k, h = box.clientHeight / gv.k;
      // keep at least a quarter of the view on the graph (once the box has a size)
      if (w && h) gv.x = Math.min(Math.max(gv.x, -w * 0.75), gl.width - w * 0.25);
      if (w && h) gv.y = Math.min(Math.max(gv.y, -h * 0.75), gl.height - h * 0.25);
      cam.setAttribute("transform", `scale(${gv.k}) translate(${-gv.x},${-gv.y})`);
    };
    const reset = () => { gv = { k: baseK(), x: 0, y: 0, touched: false, sig }; apply(); };
    const fit = () => {
      const k = Math.min(box.clientWidth / gl.width, box.clientHeight / gl.height, MAX_K);
      gv = { ...gv, k, touched: true, x: -(box.clientWidth / k - gl.width) / 2, y: -(box.clientHeight / k - gl.height) / 2 };
      apply();
    };
    const zoomAt = (f, cx, cy) => {
      const k = Math.min(MAX_K, Math.max(Math.min(0.15, minK()), gv.k * f));
      gv.x += cx / gv.k - cx / k; gv.y += cy / gv.k - cy / k; gv.k = k; gv.touched = true;
      apply();
    };
    size();
    if (!gv || gv.sig !== sig || !gv.touched) reset(); else apply();
    // The frame may not have its final width yet on first paint; settle again.
    requestAnimationFrame(() => { if (!gv.touched && document.body.contains(box)) { size(); reset(); } });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!gv.touched && document.body.contains(box)) { size(); reset(); } });

    box.querySelector(".gctl").addEventListener("click", (e) => {
      const z = e.target.closest("[data-gz]")?.dataset.gz; if (!z) return;
      e.stopPropagation();
      const c = [box.clientWidth / 2, box.clientHeight / 2];
      if (z === "in") zoomAt(1.25, ...c); else if (z === "out") zoomAt(0.8, ...c);
      else if (z === "fit") fit(); else reset();
    });
    box.addEventListener("wheel", (e) => {
      const r = box.getBoundingClientRect();
      if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.0025), e.clientX - r.left, e.clientY - r.top); }
      else if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { e.preventDefault(); gv.x += e.deltaX / gv.k; gv.touched = true; apply(); }
    }, { passive: false });

    // Pointer pan and two-finger pinch. A drag of more than 4px swallows the
    // click that follows, so panning never opens a phase.
    const pts = new Map();
    let start = null, moved = false, pinch = null;
    box.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".gctl")) return;
      pts.set(e.pointerId, [e.clientX, e.clientY]);
      if (pts.size === 1) { start = { px: e.clientX, py: e.clientY, x: gv.x, y: gv.y }; moved = false; }
      if (pts.size === 2) { const [a, b2] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b2[0], a[1] - b2[1]), k: gv.k }; }
    });
    box.addEventListener("pointermove", (e) => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, [e.clientX, e.clientY]);
      const r = box.getBoundingClientRect();
      if (pts.size >= 2 && pinch) {
        const [a, b2] = [...pts.values()];
        const d = Math.hypot(a[0] - b2[0], a[1] - b2[1]);
        moved = true;
        zoomAt((pinch.k * d / pinch.d) / gv.k, (a[0] + b2[0]) / 2 - r.left, (a[1] + b2[1]) / 2 - r.top);
        return;
      }
      if (!start) return;
      const dx = e.clientX - start.px, dy = e.clientY - start.py;
      if (!moved && Math.hypot(dx, dy) < 4) return;
      if (!moved) { moved = true; box.setPointerCapture(e.pointerId); box.classList.add("panning"); }
      gv.x = start.x - dx / gv.k; gv.y = start.y - dy / gv.k; gv.touched = true;
      apply();
    });
    const end = (e) => {
      pts.delete(e.pointerId);
      if (pts.size < 2) pinch = null;
      if (!pts.size) { start = null; box.classList.remove("panning"); }
    };
    box.addEventListener("pointerup", end);
    box.addEventListener("pointercancel", end);
    box.addEventListener("click", (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);

    new ResizeObserver(() => { if (!document.body.contains(box)) return; if (!gv.touched) { size(); reset(); } else apply(); }).observe(box);
  }

  function render() {
    if (!board) return;
    document.title = board.title || board.name;
    const updated = board.updatedAt ? `Updated ${fmtTime(board.updatedAt)}` : "";
    app.innerHTML = `
      <header>
        <div class="eyebrow">${inline(board.subtitle || board.name)}</div>
        <h1>${inline(board.title || board.name)}</h1>
        ${board.lede ? `<div class="lede">${md(board.lede)}</div>` : ""}
        <div class="stamp">${updated}</div>
      </header>
      ${summary(board)}
      <div class="tools"><button class="btn" id="tb-expand">Expand all</button><button class="btn" id="tb-collapse">Collapse all</button></div>
      ${board.waves.length ? waves(board) : `<section class="panel empty"><h2>No phases yet</h2><p>Add one with <code>trackerboard insert --phase P1 --title "…"</code>.</p></section>`}
      ${graph(board)}
      ${board.log && board.log.length ? `<section class="panel" aria-label="Change log"><h2 style="margin-bottom:10px">Recent changes</h2><ul class="log">${board.log.map((e) => `<li><time datetime="${esc(e.at)}">${fmtTime(e.at)}</time><div>${inline(e.text)}</div></li>`).join("")}</ul></section>` : ""}
      ${board.notes ? `<section class="panel notes" aria-label="Notes"><h2 style="margin-bottom:10px">Notes</h2>${md(board.notes)}</section>` : ""}`;
    initGraph();
  }

  app.addEventListener("click", (e) => {
    const f = e.target.closest("[data-filter]");
    if (f) { const v = f.dataset.filter || null; filter = filter === v ? null : v; try { filter ? localStorage.setItem("tb-filter", filter) : localStorage.removeItem("tb-filter"); } catch {} render(); return; }
    if (e.target.id === "tb-expand" || e.target.id === "tb-collapse") {
      const open = e.target.id === "tb-expand";
      app.querySelectorAll("details.phase").forEach((d) => { d.open = open; });
      return;
    }
    const j = e.target.closest("[data-jump]");
    if (j) { e.preventDefault(); jump(j.dataset.jump); }
  });
  app.addEventListener("keydown", (e) => {
    const j = e.target.closest && e.target.closest(".gnode");
    if (j && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); jump(j.dataset.jump); }
  });
  app.addEventListener("toggle", (e) => {
    const d = e.target;
    if (!d.classList || !d.classList.contains("phase")) return;
    const id = phasesOf(board).map(({ phase }) => phase.id).find((p) => domId(p) === d.id);
    if (id) d.open ? openIds.add(id) : openIds.delete(id);
  }, true);
  function jump(id) {
    let el = document.getElementById(domId(id));
    if (!el && filter) { filter = null; render(); el = document.getElementById(domId(id)); }
    if (!el) return;
    el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 1400);
  }

  try {
    const embedded = JSON.parse(document.getElementById("tb-data").textContent);
    if (embedded) { board = embedded; render(); }
  } catch {}

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then((db) => {
      if (!db) return;
      db.doc("board/state").onSnapshot((snap) => {
        if (!snap.exists) return;
        board = snap.data();
        render();
      }, () => {});
    });
  }
})();
</script>
